# Facts about the paper and this site. The home page reads them, so edit
# them here and not in index.qmd. Values are Markdown, so *Journal* gives
# italics. Leave a value as "" until you have it.
supplement:
  paper-title: "Title of the paper"
  citation: "Author, A. A., & Author, B. B. (Year). Title of the paper. *Journal Name*."
  # A link to the preprint, if there is one.
  preprint: ""
  contact: "Your Name, Your Institution. Your email address."
  # SPDX license identifiers. LICENSE.md and LICENSE-CC-BY.md hold the texts.
  license:
    code: "MIT"
    content: "CC-BY-4.0"
  authors:
    - name: "A. A. Author"
      orcid: ""
      affiliation: ""
    - name: "B. B. Author"
      orcid: ""
      affiliation: ""
  # Zenodo gives these after the first GitHub release. version-doi names one
  # release, and concept-doi names all of them. The badge shows version-doi,
  # or concept-doi when version-doi is empty.
  zenodo:
    version-doi: ""
    concept-doi: ""
    archive-url: ""
  # Files for the data table on the home page. Paths are relative to this
  # folder. A file that does not exist stops the render.
  data:
    - file: data/example.csv
      description: "Example data for the example report"
