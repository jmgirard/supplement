url: https://jmgirard.github.io/supplement/

template:
  bootstrap: 5

# The pkgdown workflow puts the demo in docs/demo after the build. See
# .github/scripts/build-demo.R.
navbar:
  structure:
    left: [intro, reference, articles, tutorials, demo, news]
  components:
    demo:
      text: Demo
      href: demo/index.html

reference:
  - title: Make a site
    desc: Make a site from the template, then add reports and data files.
    contents:
      - create_supplement
      - add_report
      - add_data
  - title: Render a site
    desc: Render the site from the R console, after a report changes or before a commit.
    contents:
      - render_supplement
  - title: Check tools and sites
    desc: Find missing tools, and check a site before a release.
    contents:
      - check_tools
      - check_supplement
  - title: Make a release
    desc: Raise the site version and write the citation files.
    contents:
      - release_supplement
      - write_citation
      - write_zenodo
  - title: Run reports in a container
    contents:
      - write_dockerfile
