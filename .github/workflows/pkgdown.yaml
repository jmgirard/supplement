# Based on the r-lib/actions v2 pkgdown example. The build job runs on every
# trigger with a read-only token and uploads the site as a run artifact.
# Only a push to main or a manual run on main also runs the deploy job, the
# one job with write access, which pushes that artifact to the gh-pages
# branch, for GitHub Pages to serve once the repository's Pages setting
# names that branch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: pkgdown

permissions: read-all

# Only one run on main runs at a time. Runs that do not deploy (pull
# requests and manual runs on other branches) each get their own group, so
# they never cancel a deploy that waits in the main group.
concurrency:
  group: pkgdown-${{ github.ref == 'refs/heads/main' || github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The check_tools() example on the site reports the Quarto it finds.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown makes a page from top-level .md files such as CLAUDE.md and
      # has no setting to skip one. CLAUDE.md holds notes for coding agents,
      # not package docs, so the build leaves it out.
      - name: Leave CLAUDE.md off the site
        run: rm -f CLAUDE.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # The demo is a filled-in site for a made-up diary study of sleep and
      # mood, made from create_supplement() with the content in .github/demo/.
      # The script stops when a render fails, check_supplement() finds a
      # problem, or a template text that it edits has changed. That fails
      # this job, so a broken demo also stops the deploy of the whole site.
      # The time limit fails a hung render instead of holding the job.
      - name: Build demo site
        timeout-minutes: 15
        run: Rscript .github/scripts/build-demo.R docs/demo

      # The upload skips hidden files unless told otherwise, and the build
      # writes docs/.nojekyll. The artifact is kept for one day, so after
      # that a failed deploy needs a re-run of all jobs, not of the deploy
      # job alone.
      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    # This is the one job with write access, so it pins each action to a
    # full commit hash, with that commit's release tag in a comment. A tag
    # can be moved to other code, and a hash cannot. The build job and
    # R-CMD-check.yaml use version tags, and the build job makes the site
    # that this job publishes, so these pins guard the write token, not
    # the site's content. To update a pin, read the commit of the new full
    # release tag (such as v7.0.1, not v7) from the action's own repository,
    # and put that tag in the comment:
    #   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The deploy action works from the git repository in the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: docs

      # clean: true deletes files on gh-pages that this build did not make,
      # such as the page of a removed help topic. The action always keeps
      # .git, .github, and .ssh, and keeps a CNAME or .nojekyll that the
      # build does not write.
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
