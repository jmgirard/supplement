# Based on the r-lib/actions v2 pkgdown example. A pull request, or a manual
# run on another branch, only builds the site. Only a push to main or a
# manual run on main also pushes it to the gh-pages branch, for GitHub Pages
# to serve once the repository's Pages setting names that branch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only one deploy runs at a time; pull request builds run in parallel.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The check_tools() example on the site reports the Quarto it finds.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown makes a page from top-level .md files such as CLAUDE.md and
      # has no setting to skip one. CLAUDE.md holds notes for coding agents,
      # not package docs, so the build leaves it out.
      - name: Leave CLAUDE.md off the site
        run: rm -f CLAUDE.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # clean: true deletes files on gh-pages that this build did not make,
      # such as the page of a removed help topic. The action always keeps
      # .git and .github, and keeps a CNAME that the build does not write.
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
